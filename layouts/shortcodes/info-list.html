
<style>
.info-list {
    margin: 1.5rem 0 2rem;
    padding: 1rem 0;
    border-top: 1px solid currentColor;
    border-bottom: 1px solid rgba(127, 127, 127, 0.35);
}

.info-list dl {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr);
    column-gap: 1.5rem;
    row-gap: 0.75rem;
    margin: 0;
}

.info-list dt {
    margin: 0;
    opacity: 0.65;
    font-size: 0.9em;
}

.info-list dd {
    margin: 0;
    min-width: 0;
}

.info-list dd p {
    margin: 0;
}

@media (max-width: 600px) {
    .info-list dl {
        grid-template-columns: 1fr;
        gap: 0.25rem;
    }

    .info-list dd {
        margin-bottom: 1rem;
    }
}
</style>


<div class="info-list">
    {{ .Inner | markdownify }}
</div>
