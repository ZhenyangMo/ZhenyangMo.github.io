baseURL: 'https://ZhenyangMo.github.io'
title: 'Zhenyang Mo的博客'
theme: hugo-theme-ladder
license: MIT
licenselink: 'https://github.com/guangzhengli/hugo-theme-ladder/blob/master/LICENSE'
description: 'Zhenyang Mo 的个人博客，记录阅读、思考与学习。'
homepage: 'https://ZhenyangMo.github.io'
defaultContentLanguage: 'zh'
locale: 'zh-CN'


services:
  googleAnalytics:
    id: G-DM69QBBPCM


paginate: 10


params:
  brand: Zhenyang
  avatarURL: /images/avatar.png

  author: Zhenyang Mo
  authorEmail: mozhenyang@bupt.edu.cn
  authorDescription: 阅读与思考，真理与自由
  info: 持续学习，更新思想
  favicon: /images/avatar2.png
  options:
    showDarkMode: true
    enableImgZooming: true
    enableMultiLang: false
  darkModeTheme: data-dark-mode
  #darkModeTheme: icy-dark-mode
  comments:
    giscus:
      enable: true
      repo: ZhenyangMo/ZhenyangMo.github.io
      repo_id: R_kgDOU7Jq_g
      category: Announcements
      category_id: DIC_kwDOU7Jq_s4DHDtp
      mapping: pathname
      position: top
      lang: zh-CN # pick a language from https://github.com/giscus/giscus/tree/main/locales
    utteranc:
      enable: false
      repo: username/xxx
      issueTerm: pathname
  analytics:
    google:
      SiteVerificationTag: xxx
    umami:
      enable: false
      website_id: xxx
      url: https://xxx
  guestbook:
    title: 留言板
    description: 您的评论，会让这个网站更加精彩！
  social:
    - name: GitHub
      pre: >-
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-github"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
      url: 'https://github.com/ZhenyangMo'
